server.port=${PORT:8080}

# Java 21 Virtual Threads for high-concurrency non-blocking I/O
spring.threads.virtual.enabled=true

# Database Configuration with Environment Variable support
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seat_reservation}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# HikariCP Connection Pool Optimized for Heavy Concurrency
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=15000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Structured Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{trace_id:-none} userId=%X{user_id:-none}] %logger{36} - %msg%n
logging.level.com.paytm.reservation=INFO
logging.level.org.springframework.web=INFO
